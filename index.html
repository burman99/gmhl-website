/* ---------------- admin: drawer + generic list editor ---------------- */

function renderAdminDrawer(){
  var tabs = ADMIN_TABS.map(function(t,i){ return '<button class="drawer-tab '+(i===0?'active':'')+'" data-tab="'+t.key+'" type="button">'+t.label+'</button>'; }).join('');
  var panels = ADMIN_TABS.map(function(t,i){ return '<div class="admin-tabpanel '+(i===0?'active':'')+'" id="admin-panel-'+t.key+'"></div>'; }).join('');
  return '<div class="scrim" id="admin-scrim"></div>'
    + '<div class="drawer" id="admin-drawer" role="dialog" aria-label="Executive Tools">'
    + '<div class="drawer-head"><h2>Executive Tools</h2><button class="btn btn-ghost btn-sm" data-action="close-admin" type="button">&times;</button></div>'
    + '<div class="drawer-tabs" id="admin-tabs">'+tabs+'</div>'
    + '<div class="drawer-body" id="admin-body">'+panels+'</div>'
    + '<div class="drawer-foot">'
    + '<input type="password" id="admin-password" placeholder="Executive password" autocomplete="current-password">'
    + '<div class="drawer-foot-row"><span class="drawer-note" id="admin-note">Changes publish live for every visitor.</span>'
    + '<button class="btn btn-primary btn-sm" id="admin-publish-btn" data-action="publish" type="button">Publish Changes</button></div>'
    + '</div>'
    + '</div>';
}

function openAdminDrawer(){
  draft = JSON.parse(JSON.stringify(state));
  dirty = false;
  scoresSearch = '';
  formState = null;
  rosterTeamSlug = null;
  rosterFormState = null;
  scoresPenaltyOpenGameId = null;
  document.getElementById('admin-scrim').classList.add('open');
  document.getElementById('admin-drawer').classList.add('open');
  switchAdminTab('scores');
  refreshAdminPanels();
  updatePublishNote();
  var pwEl = document.getElementById('admin-password');
  if(pwEl){
    try { pwEl.value = sessionStorage.getItem('gmhl_admin_pw') || ''; } catch(e){}
  }
}
function closeAdminDrawer(){
  if(dirty && !confirm('Discard unsaved changes?')) return;
  document.getElementById('admin-scrim').classList.remove('open');
  document.getElementById('admin-drawer').classList.remove('open');
}
function switchAdminTab(key){
  document.querySelectorAll('.drawer-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===key); });
  document.querySelectorAll('.admin-tabpanel').forEach(function(p){ p.classList.toggle('active', p.id==='admin-panel-'+key); });
}
function markDirty(){ dirty = true; updatePublishNote(); }
function updatePublishNote(){
  var note = document.getElementById('admin-note');
  var btn = document.getElementById('admin-publish-btn');
  if(!note || !btn) return;
  note.textContent = dirty ? 'You have unsaved changes.' : 'Changes publish live for every visitor.';
}

function refreshAdminPanels(){
  var scoresPanel = document.getElementById('admin-panel-scores');
  if(scoresPanel) scoresPanel.innerHTML = renderScoresAdmin();
  var rostersPanel = document.getElementById('admin-panel-rosters');
  if(rostersPanel) rostersPanel.innerHTML = renderRostersAdmin();
  ['suspensions','executives','rules'].forEach(function(key){
    var panel = document.getElementById('admin-panel-'+key);
    if(panel) panel.innerHTML = renderListAdmin(key, SCHEMAS[key]);
  });
}

/* ---------------- admin: rosters tab (nested per-team, so it's bespoke rather than a generic SCHEMAS entry) ---------------- */

function currentRosterTeam(){
  return draft.teams.find(function(t){ return t.slug === rosterTeamSlug; });
}
function renderRostersAdmin(){
  var teams = draft.teams.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  if(!rosterTeamSlug || !teams.some(function(t){ return t.slug === rosterTeamSlug; })){
    rosterTeamSlug = teams.length ? teams[0].slug : null;
  }
  var teamOpts = teams.map(function(t){ return '<option value="'+t.slug+'" '+(t.slug===rosterTeamSlug?'selected':'')+'>'+esc(t.name)+'</option>'; }).join('');
  return '<div class="field"><label>Team</label><select id="roster-team-select">'+teamOpts+'</select></div>'
    + '<div id="roster-captain-card">'+renderCaptainCard()+'</div>'
    + '<div id="roster-player-list">'+renderRosterPlayerList()+'</div>';
}
function renderCaptainCard(){
  var team = currentRosterTeam();
  if(!team) return '';
  var cap = team.captain || {name:'', phone:''};
  return '<div class="card" style="margin:10px 0 14px;border:1px solid var(--border-soft);">'
    + '<div style="font-weight:700;margin-bottom:10px;">Team Captain</div>'
    + '<div class="field"><label>Name</label><input type="text" id="captain-field-name" value="'+esc(cap.name)+'"></div>'
    + '<div class="field"><label>Phone Number</label><input type="text" id="captain-field-phone" value="'+esc(cap.phone)+'"></div>'
    + '<button class="btn btn-outline btn-sm" data-action="save-captain" type="button">Save Captain Info</button>'
    + '</div>';
}
function saveCaptainInfo(){
  var team = currentRosterTeam();
  if(!team) return;
  var nameEl = document.getElementById('captain-field-name');
  var phoneEl = document.getElementById('captain-field-phone');
  team.captain = {
    name: ((nameEl ? nameEl.value : '') || '').trim(),
    phone: ((phoneEl ? phoneEl.value : '') || '').trim()
  };
  markDirty();
  toast('Captain info saved — publish to make it live.');
}
function renderRosterPlayerList(){
  var team = currentRosterTeam();
  if(!team) return '<div class="admin-empty">No team selected.</div>';
  var roster = (team.roster || []).slice().sort(function(a,b){ return (a.number||0)-(b.number||0); });
  var rows = roster.map(function(p){
    return '<div class="admin-row"><div class="admin-row-head"><div>'
      + '<div class="admin-row-title">#'+esc(p.number)+' &mdash; '+esc(p.name)+'</div>'
      + '</div><div class="admin-actions">'
      + '<button class="btn btn-outline btn-sm" data-action="roster-edit" data-id="'+p.id+'" type="button">Edit</button>'
      + '<button class="btn btn-danger btn-sm" data-action="roster-delete" data-id="'+p.id+'" type="button">Delete</button>'
      + '</div></div></div>';
  }).join('');
  return (rows || '<div class="admin-empty">No players on this roster yet.</div>')
    + '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" data-action="roster-add" type="button">+ Add Player</button>'
    + '<div id="roster-player-form"></div>';
}
function renderRosterPlayerFormHTML(values, isEdit){
  return '<div class="card" style="margin-top:10px;border:1px solid var(--ice-dim);">'
    + '<div style="font-weight:700;margin-bottom:10px;">'+(isEdit?'Edit':'Add')+' Player</div>'
    + '<div class="field"><label>Jersey Number</label><input type="number" min="0" id="roster-field-number" value="'+esc(values.number)+'"></div>'
    + '<div class="field"><label>Full Name</label><input type="text" id="roster-field-name" value="'+esc(values.name)+'"></div>'
    + '<div style="display:flex;gap:8px;margin-top:6px;">'
    + '<button class="btn btn-primary btn-sm" data-action="roster-save" type="button">Save</button>'
    + '<button class="btn btn-ghost btn-sm" data-action="roster-cancel" type="button">Cancel</button>'
    + '</div></div>';
}
function openRosterPlayerForm(id){
  var team = currentRosterTeam();
  if(!team) return;
  var values = id != null
    ? Object.assign({}, (team.roster||[]).find(function(p){ return p.id === id; }))
    : {number:'', name:''};
  rosterFormState = {id: id, values: values};
  var container = document.getElementById('roster-player-form');
  if(container) container.innerHTML = renderRosterPlayerFormHTML(values, id != null);
}
function saveRosterPlayerForm(){
  if(!rosterFormState) return;
  var team = currentRosterTeam();
  if(!team) return;
  var numberEl = document.getElementById('roster-field-number');
  var nameEl = document.getElementById('roster-field-name');
  var number = Math.max(0, parseInt(numberEl ? numberEl.value : '0', 10) || 0);
  var name = ((nameEl ? nameEl.value : '') || '').trim();
  if(!name){ toast('Enter a player name.'); return; }
  if(!team.roster) team.roster = [];
  if(rosterFormState.id != null){
    var p = team.roster.find(function(x){ return x.id === rosterFormState.id; });
    if(p){ p.number = number; p.name = name; }
  } else {
    team.roster.push({id: nextId(team.roster), number: number, name: name});
  }
  rosterFormState = null;
  markDirty();
  refreshAdminPanels();
}
function cancelRosterPlayerForm(){ rosterFormState = null; refreshAdminPanels(); }
function deleteRosterPlayer(id){
  var team = currentRosterTeam();
  if(!team) return;
  if(!confirm('Delete this player from the roster? This takes effect once you publish.')) return;
  team.roster = (team.roster || []).filter(function(p){ return p.id !== id; });
  markDirty();
  refreshAdminPanels();
}

function renderListAdmin(coll, schema){
  var items = draft[coll];
  var rows = items.map(function(item){
    return '<div class="admin-row"><div class="admin-row-head"><div>'
      + '<div class="admin-row-title">'+esc(schema.itemLabel(item))+'</div>'
      + (item.date ? '<div class="admin-row-sub">'+esc(item.date)+'</div>' : '')
      + '</div><div class="admin-actions">'
      + '<button class="btn btn-outline btn-sm" data-action="edit-item" data-coll="'+coll+'" data-id="'+item.id+'" type="button">Edit</button>'
      + '<button class="btn btn-danger btn-sm" data-action="delete-item" data-coll="'+coll+'" data-id="'+item.id+'" type="button">Delete</button>'
      + '</div></div></div>';
  }).join('');
  return (rows || '<div class="admin-empty">Nothing here yet.</div>')
    + '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;" data-action="add-item" data-coll="'+coll+'" type="button">+ Add '+esc(schema.title)+'</button>'
    + '<div id="admin-form-'+coll+'"></div>';
}

function renderItemFormHTML(coll, schema, values, isEdit){
  var fieldsHtml = schema.fields.map(function(f){
    var val = values[f.key] != null ? values[f.key] : '';
    if(f.type === 'textarea'){
      return '<div class="field"><label>'+esc(f.label)+'</label><textarea data-field="'+f.key+'">'+esc(val)+'</textarea></div>';
    }
    if(f.type === 'select'){
      var opts = typeof f.options === 'function' ? f.options() : f.options;
      return '<div class="field"><label>'+esc(f.label)+'</label><select data-field="'+f.key+'">'
        + opts.map(function(o){ return '<option value="'+esc(o)+'" '+(o===val?'selected':'')+'>'+esc(o)+'</option>'; }).join('')
        + '</select></div>';
    }
    var inputType = f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text');
    return '<div class="field"><label>'+esc(f.label)+'</label><input type="'+inputType+'" data-field="'+f.key+'" value="'+esc(val)+'"></div>';
  }).join('');
  return '<div class="card" style="margin-top:10px;border:1px solid var(--ice-dim);">'
    + '<div style="font-weight:700;margin-bottom:10px;">'+(isEdit?'Edit':'Add')+' '+esc(schema.title)+'</div>'
    + fieldsHtml
    + '<div style="display:flex;gap:8px;margin-top:6px;">'
    + '<button class="btn btn-primary btn-sm" data-action="save-item" data-coll="'+coll+'" type="button">Save</button>'
    + '<button class="btn btn-ghost btn-sm" data-action="cancel-item" type="button">Cancel</button>'
    + '</div></div>';
}

function openItemForm(coll, existingId){
  var schema = SCHEMAS[coll];
  var values = existingId != null
    ? Object.assign({}, draft[coll].find(function(x){ return x.id === existingId; }))
    : schema.empty();
  formState = {coll: coll, id: existingId, values: values};
  var container = document.getElementById('admin-form-'+coll);
  if(container) container.innerHTML = renderItemFormHTML(coll, schema, values, existingId != null);
}
function saveItemForm(){
  if(!formState) return;
  var coll = formState.coll, id = formState.id, values = formState.values;
  var container = document.getElementById('admin-form-'+coll);
  var inputs = container.querySelectorAll('[data-field]');
  inputs.forEach(function(el){
    var key = el.dataset.field;
    values[key] = el.type === 'number' ? Number(el.value || 0) : el.value;
  });
  if(id != null){
    var idx = draft[coll].findIndex(function(x){ return x.id === id; });
    draft[coll][idx] = Object.assign({}, draft[coll][idx], values);
  } else {
    values.id = nextId(draft[coll]);
    draft[coll] = draft[coll].concat([values]);
  }
  formState = null;
  markDirty();
  refreshAdminPanels();
}
function cancelItemForm(){ formState = null; refreshAdminPanels(); }
function deleteItem(coll, id){
  if(!confirm('Delete this entry? This takes effect once you publish.')) return;
  draft[coll] = draft[coll].filter(function(x){ return x.id !== id; });
  markDirty();
  refreshAdminPanels();
}

/* ---------------- admin: scores tab ---------------- */

function renderScoresAdmin(){
  return '<input class="filter admin-search" style="width:100%;" id="scores-search" placeholder="Search team or date (YYYY-MM-DD)&hellip;" value="'+esc(scoresSearch)+'">'
    + '<div id="scores-list">'+renderScoresList()+'</div>';
}
function renderScoresList(){
  var q = scoresSearch.toLowerCase();
  var games = sortGamesChrono(draft.schedule).filter(function(g){
    return !q || g.home.toLowerCase().indexOf(q) > -1 || g.away.toLowerCase().indexOf(q) > -1 || g.date.indexOf(q) > -1;
  });
  if(!games.length) return '<div class="admin-empty">No games found.</div>';
  return games.map(function(g){
    var played = isPlayed(g);
    return '<div class="admin-row"><div class="admin-row-head"><div>'
      + '<div class="admin-row-title">'+esc(g.home)+' vs '+esc(g.away)+'</div>'
      + '<div class="admin-row-sub">'+fmtDateShort(g.date)+' &middot; '+esc(fmtTime(g.time))+'</div></div>'
      + (played ? '<span class="pill pill-win">Final</span>' : '<span class="pill pill-ice">Upcoming</span>')
      + '</div>'
      + '<div class="admin-score-inputs">'
      + '<span style="font-size:12px;color:var(--text-faint);width:74px;overflow:hidden;text-overflow:ellipsis;">'+esc(g.home)+'</span>'
      + '<input type="number" min="0" data-score="hg" data-id="'+g.id+'" value="'+(g.hg==null?'':g.hg)+'" placeholder="&ndash;">'
      + '<span style="color:var(--text-faint);">&ndash;</span>'
      + '<input type="number" min="0" data-score="ag" data-id="'+g.id+'" value="'+(g.ag==null?'':g.ag)+'" placeholder="&ndash;">'
      + '<span style="font-size:12px;color:var(--text-faint);width:74px;overflow:hidden;text-overflow:ellipsis;">'+esc(g.away)+'</span>'
      + '<label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-faint);margin-left:auto;white-space:nowrap;">'
      + '<input type="checkbox" data-score="ot" data-id="'+g.id+'" '+(g.ot?'checked':'')+' style="width:auto;"> OT/SO</label>'
      + '</div>'
      + '<button class="btn btn-ghost btn-sm" style="margin-top:8px;" data-action="toggle-penalties" data-id="'+g.id+'" type="button">Penalties ('+((g.penalties||[]).length)+')</button>'
      + (scoresPenaltyOpenGameId === g.id ? renderPenaltyEditor(g) : '')
      + '</div>';
  }).join('');
}
function renderPenaltyEditor(g){
  var home = draft.teams.find(function(t){ return t.name === g.home; });
  var penalties = g.penalties || [];
  var rows = penalties.map(function(p){
    return '<div class="admin-row" style="padding:8px 10px;"><div class="admin-row-head"><div>'
      + '<div class="admin-row-title" style="font-size:13px;">'+esc(p.team)+' &mdash; '+esc(p.player)+'</div>'
      + '<div class="admin-row-sub">'+esc(p.minutes)+' PIM</div></div>'
      + '<div class="admin-actions"><button class="btn btn-danger btn-sm" data-action="delete-penalty" data-game="'+g.id+'" data-id="'+p.id+'" type="button">Delete</button></div>'
      + '</div></div>';
  }).join('');
  var players = (home && home.roster) || [];
  var playerOpts = players.length
    ? players.map(function(p){ return '<option value="'+esc(p.name)+'">#'+esc(p.number)+' '+esc(p.name)+'</option>'; }).join('')
    : '<option value="">No players on roster</option>';
  return '<div class="penalty-editor">'
    + (rows || '<div class="admin-empty" style="padding:8px 0;">No penalties logged for this game.</div>')
    + '<div class="penalty-add-row">'
    + '<select data-penalty-team data-game="'+g.id+'">'
      + '<option value="'+esc(g.home)+'">'+esc(g.home)+'</option>'
      + '<option value="'+esc(g.away)+'">'+esc(g.away)+'</option>'
      + '</select>'
    + '<select data-penalty-player data-game="'+g.id+'">'+playerOpts+'</select>'
    + '<input type="number" min="1" data-penalty-minutes data-game="'+g.id+'" value="2">'
    + '<button class="btn btn-outline btn-sm" data-action="add-penalty" data-game="'+g.id+'" type="button">+ Add</button>'
    + '</div></div>';
}
function togglePenalties(gameId){
  scoresPenaltyOpenGameId = (scoresPenaltyOpenGameId === gameId) ? null : gameId;
  var list = document.getElementById('scores-list');
  if(list) list.innerHTML = renderScoresList();
}
function addPenalty(gameId){
  var g = draft.schedule.find(function(x){ return x.id === gameId; });
  if(!g) return;
  var teamSel = document.querySelector('[data-penalty-team][data-game="'+gameId+'"]');
  var playerSel = document.querySelector('[data-penalty-player][data-game="'+gameId+'"]');
  var minutesEl = document.querySelector('[data-penalty-minutes][data-game="'+gameId+'"]');
  var teamName = teamSel ? teamSel.value : '';
  var playerName = playerSel ? playerSel.value : '';
  var minutes = Math.max(1, parseInt(minutesEl ? minutesEl.value : '2', 10) || 2);
  if(!playerName){ toast('Add players to that team\'s roster first (Rosters tab).'); return; }
  if(!g.penalties) g.penalties = [];
  g.penalties.push({id: nextId(g.penalties), team: teamName, player: playerName, minutes: minutes});
  markDirty();
  var list = document.getElementById('scores-list');
  if(list) list.innerHTML = renderScoresList();
}
function deletePenalty(gameId, penaltyId){
  var g = draft.schedule.find(function(x){ return x.id === gameId; });
  if(!g) return;
  g.penalties = (g.penalties || []).filter(function(p){ return p.id !== penaltyId; });
  markDirty();
  var list = document.getElementById('scores-list');
  if(list) list.innerHTML = renderScoresList();
}
function handleScoreInput(el){
  var id = Number(el.dataset.id);
  var g = draft.schedule.find(function(x){ return x.id === id; });
  if(!g) return;
  var field = el.dataset.score;
  if(field === 'ot'){ g.ot = el.checked; }
  else {
    var v = el.value.trim();
    g[field] = v === '' ? null : Math.max(0, parseInt(v,10) || 0);
  }
  markDirty();
}

/* ---------------- publish (Cloudflare Pages Functions + KV) ---------------- */

async function refreshStateFromServer(){
  try {
    var res = await fetch('/api/state', {cache: 'no-store'});
    if(!res.ok) return;
    var fresh = await res.json();
    if(!fresh || !fresh.schedule) return;
    state = fresh;
    document.getElementById('root').innerHTML = renderApp(state);
    route();
  } catch(e){ /* offline, or backend not set up yet — keep the built-in seed data */ }
}

async function doPublish(){
  if(!dirty){ toast('No changes to publish yet.'); return; }
  var pwEl = document.getElementById('admin-password');
  var password = pwEl ? pwEl.value : '';
  if(!password){ toast('Enter the executive password to publish.'); return; }
  var btn = document.getElementById('admin-publish-btn');
  var oldLabel = btn.textContent;
  btn.disabled = true; btn.textContent = 'Publishing…';
  try {
    draft.updatedAt = new Date().toISOString();
    var res = await fetch('/api/update', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: password, state: draft})
    });
    if(res.status === 401){
      toast('Wrong password.');
      return;
    }
    if(!res.ok){
      toast('Could not publish changes (server error).');
      return;
    }
    try { sessionStorage.setItem('gmhl_admin_pw', password); } catch(e){}
    state = JSON.parse(JSON.stringify(draft));
    dirty = false;
    toast('Published! Everyone will see the update.');
    document.getElementById('root').innerHTML = renderApp(state);
    route();
  } catch(e){
    toast('Could not publish changes: network error.');
  } finally {
    btn.disabled = false; btn.textContent = oldLabel;
    updatePublishNote();
  }
}

/* ---------------- routing ---------------- */

function route(){
  var hash = (location.hash || '#home').slice(1);
  var teamSlug = null;
  if(hash.indexOf('rosters/') === 0){ teamSlug = hash.split('/')[1]; hash = 'rosters'; }
  if(ALL_HASHES.indexOf(hash) === -1) hash = 'home';
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id === 'page-'+hash); });
  document.querySelectorAll('[data-nav]').forEach(function(a){ a.classList.toggle('active', a.dataset.nav === hash); });
  var nav = document.getElementById('mainnav');
  if(nav) nav.classList.remove('open');
  window.scrollTo(0,0);
  if(teamSlug) openTeamModal(teamSlug);
}

function applyTeamFilter(prefix, team){
  document.querySelectorAll('#'+prefix+'-groups .game-row').forEach(function(row){
    var show = !team || row.dataset.home === team || row.dataset.away === team;
    row.style.display = show ? '' : 'none';
  });
  document.querySelectorAll('#'+prefix+'-groups .date-group').forEach(function(g){
    var anyVisible = Array.prototype.some.call(g.querySelectorAll('.game-row'), function(r){ return r.style.display !== 'none'; });
    g.style.display = anyVisible ? '' : 'none';
  });
}

/* ---------------- events ---------------- */

function onDocClick(e){
  if(e.target.id === 'team-modal-scrim'){ closeTeamModal(); return; }
  if(e.target.closest('#hamburger-btn')){ document.getElementById('mainnav').classList.toggle('open'); return; }
  var navLink = e.target.closest('nav.mainnav a');
  if(navLink){ document.getElementById('mainnav').classList.remove('open'); }
  var el = e.target.closest('[data-action]');
  if(el){
    var action = el.dataset.action;
    if(action === 'open-admin') openAdminDrawer();
    else if(action === 'close-admin') closeAdminDrawer();
    else if(action === 'open-team') openTeamModal(el.dataset.slug);
    else if(action === 'close-team-modal') closeTeamModal();
    else if(action === 'add-item') openItemForm(el.dataset.coll, null);
    else if(action === 'edit-item') openItemForm(el.dataset.coll, Number(el.dataset.id));
    else if(action === 'delete-item') deleteItem(el.dataset.coll, Number(el.dataset.id));
    else if(action === 'save-item') saveItemForm();
    else if(action === 'cancel-item') cancelItemForm();
    else if(action === 'publish') doPublish();
    else if(action === 'roster-add') openRosterPlayerForm(null);
    else if(action === 'roster-edit') openRosterPlayerForm(Number(el.dataset.id));
    else if(action === 'roster-delete') deleteRosterPlayer(Number(el.dataset.id));
    else if(action === 'roster-save') saveRosterPlayerForm();
    else if(action === 'roster-cancel') cancelRosterPlayerForm();
    else if(action === 'toggle-penalties') togglePenalties(Number(el.dataset.id));
    else if(action === 'add-penalty') addPenalty(Number(el.dataset.game));
    else if(action === 'delete-penalty') deletePenalty(Number(el.dataset.game), Number(el.dataset.id));
    else if(action === 'save-captain') saveCaptainInfo();
  }
  var tabBtn = e.target.closest('.drawer-tab');
  if(tabBtn) switchAdminTab(tabBtn.dataset.tab);
}
function onDocInput(e){
  if(e.target.id === 'scores-search'){
    scoresSearch = e.target.value;
    var list = document.getElementById('scores-list');
    if(list) list.innerHTML = renderScoresList();
    return;
  }
  if(e.target.matches && e.target.matches('[data-score="hg"], [data-score="ag"]')){ handleScoreInput(e.target); }
}
function onDocChange(e){
  if(e.target.id === 'sched-team-filter'){ applyTeamFilter('sched', e.target.value); return; }
  if(e.target.id === 'results-team-filter'){ applyTeamFilter('results', e.target.value); return; }
  if(e.target.matches && e.target.matches('[data-score="ot"]')){ handleScoreInput(e.target); return; }
  if(e.target.id === 'roster-team-select'){
    rosterTeamSlug = e.target.value;
    rosterFormState = null;
    var list = document.getElementById('roster-player-list');
    if(list) list.innerHTML = renderRosterPlayerList();
    var capCard = document.getElementById('roster-captain-card');
    if(capCard) capCard.innerHTML = renderCaptainCard();
    return;
  }
  if(e.target.matches && e.target.matches('[data-penalty-team]')){
    var gameId = Number(e.target.dataset.game);
    var team = draft.teams.find(function(t){ return t.name === e.target.value; });
    var playerSel = document.querySelector('[data-penalty-player][data-game="'+gameId+'"]');
    if(playerSel){
      var players = (team && team.roster) || [];
      playerSel.innerHTML = players.length
        ? players.map(function(p){ return '<option value="'+esc(p.name)+'">#'+esc(p.number)+' '+esc(p.name)+'</option>'; }).join('')
        : '<option value="">No players on roster</option>';
    }
    return;
  }
}

function wireGlobalEvents(){
  document.addEventListener('click', onDocClick);
  document.addEventListener('input', onDocInput);
  document.addEventListener('change', onDocChange);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeTeamModal(); });
  window.addEventListener('hashchange', route);
}

/* ---------------- boot ---------------- */

function renderApp(st){
  return renderTopbar(st)
    + renderFinalsBanner(st)
    + '<main>'
    + renderHomePage(st)
    + renderSchedulePage(st)
    + renderStandingsPage(st)
    + renderRostersPage(st)
    + renderResultsPage(st)
    + renderRulesPage(st)
    + renderSuspensionsPage(st)
    + renderExecutivesPage(st)
    + '</main>'
    + renderFooter(st)
    + renderAdminDrawer()
    + renderTeamModal()
    + '<div id="toast-host"></div>';
}

function init(){
  document.getElementById('root').innerHTML = renderApp(state);
  route();
  wireGlobalEvents();
  refreshStateFromServer();
}
init();
</script>
</body>
</html>
